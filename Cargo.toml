[workspace]
resolver = "2"
members = ["crates/player-core", "crates/player-cli", "crates/player-gtk", "crates/player-library"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
symphonia = { version = "0.5", default-features = false, features = [
    "flac",
    "wav",
    "pcm",
    "alac",
    "isomp4",
    # Lossy: mp3/aac register their own readers; vorbis needs the ogg demuxer.
    # AAC-in-.m4a is already covered by isomp4 above. (symphonia 0.5 has no Opus
    # decoder, so .opus files index but won't play — out of scope.)
    "mp3",
    "aac",
    "vorbis",
    "ogg",
] }
alsa = "0.11"
rtrb = "0.3.4"
crossbeam-channel = "0.5.15"
thiserror = "2"
libc = "0.2.186"
clap = { version = "4.6.1", features = ["derive"] }
gtk4 = { version = "0.11.3", features = ["v4_16"] }
libadwaita = { version = "0.9.1", features = ["v1_6"] }
async-channel = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"       
