# Configuration for the one-touch music-sync share (hifi-share + its Phosh
# quick-settings button). Sourced by /usr/bin/hifi-share; plain shell assignments.
# Every value has a built-in default, so an empty or absent file still works.

# The login user whose storage is exposed over SFTP and whose library is
# re-scanned after a sync. Defaults to the first normal (uid>=1000) user.
#SHARE_USER=user

# NetworkManager connection profile (saved Wi-Fi) to bring up when sharing. Empty
# = just enable the radio and let NM auto-connect to whatever is known/in range.
# Find the name with:  nmcli -g NAME connection show
#WIFI_CONNECTION="Home"

# Folder re-indexed with `player-cli scan` after a sync (where Nautilus drops
# land). Defaults to ~SHARE_USER/Music.
#MUSIC_ROOT="/home/user/Music"

# Stable, user-writable mountpoint for the microSD card, symlinked into the share
# home as ~/sdcard. Empty = best-effort: reuse an existing udisks mount under
# /run/media/$SHARE_USER instead of mounting anything ourselves.
#SD_MOUNT="/media/sdcard"
