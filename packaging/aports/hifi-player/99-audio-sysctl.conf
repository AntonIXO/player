# Avoid swap-induced xruns; the player pre-buffers only a few MB, so swap should
# almost never be needed during playback.
vm.swappiness = 10
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2

# Stop *proactive* memory compaction: background defrag sweeps can cause multi-ms
# stalls that interrupt URB delivery. CONFIG_COMPACTION stays on (disabling it
# outright is risky / fails kconfigcheck); this is the safe runtime equivalent.
vm.compaction_proactiveness = 0

# Real-time scheduling for the SCHED_FIFO audio thread:
#  - sched_rt_runtime_us=-1 removes the global RT throttle (default caps RT at
#    950ms/1s); without it a busy audio thread can be throttled mid-playback.
#    Safe here: the thread blocks on the ring buffer and is pinned to isolated cpu7.
#  - timer_migration=0 keeps timers from migrating onto the isolated audio core.
#  - nmi_watchdog=0 drops one periodic interrupt source.
kernel.sched_rt_runtime_us = -1
kernel.timer_migration = 0
kernel.nmi_watchdog = 0
