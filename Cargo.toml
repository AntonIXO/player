[workspace]
resolver = "2"
members = [
    "crates/player-core",
    "crates/player-cli",
    "crates/player-gtk",
    "crates/player-library",
    "crates/sacd",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
# GPL-3.0 because the SACD/DST support (crates/sacd) is ported from the GPLv3
# sacd-ripper project; the whole workspace is relicensed to match.
license = "GPL-3.0-or-later"

[workspace.dependencies]
symphonia = { version = "0.6", default-features = false, features = [
    "flac",
    "wav",
    "pcm",
    "alac",
    "isomp4",
    # Lossy: mp3/aac register their own readers; vorbis needs the ogg demuxer.
    # AAC-in-.m4a is already covered by isomp4 above. (symphonia still ships no
    # Opus decoder as of 0.6, so .opus files index but won't play — out of scope.)
    "mp3",
    "aac",
    "vorbis",
    "ogg",
    # SIMD decode paths (new in 0.6; arch-gated). Speeds up decode on both the
    # x86 dev box and the ARM/Poco F1 target — they're no-ops off their arch.
    "opt-simd",
    "opt-simd-sse",
    "opt-simd-avx",
    "opt-simd-neon",
] }
alsa = "0.11"
rtrb = "0.3.4"
crossbeam-channel = "0.5.15"
thiserror = "2"
libc = "0.2.186"
clap = { version = "4.6.1", features = ["derive"] }
gtk4 = { version = "0.11.3", features = ["v4_16"] }
libadwaita = { version = "0.9.1", features = ["v1_6"] }
async-channel = "2.5.0"
# DSD: .dsf/.dff frame reader (interleaved, MSB-first); the SACD .iso path is
# the in-tree `sacd` crate.
dsd-reader = "0.3"
sacd = { path = "crates/sacd" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"

# Faster iteration with a smooth UI in debug builds: optimize all third-party
# deps (gtk4, libadwaita, symphonia, rusqlite, sacd, ...) even under `cargo run`,
# while keeping our own crates lightly optimized for quick rebuilds. Bit-perfect
# verification must still use --release (see CLAUDE.md): debug `overflow-checks`
# panic on overflow but never change the wrapped integer result, so non-overflowing
# packing math is byte-identical to release.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# PGO/BOLT pipeline profile (driven by scripts/pgo-bolt-build.sh). Inherits the
# bit-perfect release settings but DISABLES strip: LLVM BOLT needs symbols +
# relocations in its input binary, and a stripped binary cannot be BOLTed. The
# script strips the final artifact itself after BOLT. opt-level/lto/codegen-units
# are inherited from [profile.release]; PGO/BOLT only change code LAYOUT (block/
# function ordering, inlining heuristics) — never numeric results — so the
# bit-perfect invariant is preserved (and re-verified by the script's loopback gate).
[profile.release-pgo]
inherits = "release"
strip = false       
