[workspace]
resolver = "2"
members = [
    "crates/player-core",
    "crates/player-cli",
    "crates/player-gtk",
    "crates/player-library",
    "crates/sacd",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
# GPL-3.0 because the SACD/DST support (crates/sacd) is ported from the GPLv3
# sacd-ripper project; the whole workspace is relicensed to match.
license = "GPL-3.0-or-later"

# Workspace-wide lint policy. Opt every crate in via `[lints] workspace = true`.
# pedantic + nursery at `warn` raise the bar during the refactor; the allow-list
# silences the high-noise / low-value lints (notably the integer-cast lints, which
# fire constantly on the intentional, bit-exact sample-packing math and would drown
# out real findings). Re-enable any of these case-by-case if a crate wants it.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Stylistic / documentation noise:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Intentional in this codebase (bit-exact integer math, sample packing):
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# High-volume / low-value style lints (would force churn in sensitive bit-exact
# code for little gain; remaining warnings stay a meaningful, fixable set):
unreadable_literal = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
default_trait_access = "allow"
too_long_first_doc_paragraph = "allow"
# nursery lints that are unstable / churny:
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
redundant_pub_crate = "allow"

[workspace.dependencies]
symphonia = { version = "0.6", default-features = false, features = [
    "flac",
    "wav",
    "pcm",
    "alac",
    "isomp4",
    # Lossy: mp3/aac register their own readers; vorbis needs the ogg demuxer.
    # AAC-in-.m4a is already covered by isomp4 above. (symphonia still ships no
    # Opus decoder as of 0.6, so .opus files index but won't play — out of scope.)
    "mp3",
    "aac",
    "vorbis",
    "ogg",
    # SIMD decode paths (new in 0.6; arch-gated). Speeds up decode on both the
    # x86 dev box and the ARM/Poco F1 target — they're no-ops off their arch.
    "opt-simd",
    "opt-simd-sse",
    "opt-simd-avx",
    "opt-simd-neon",
] }
alsa = "0.11"
rtrb = "0.3.4"
crossbeam-channel = "0.5.15"
thiserror = "2"
libc = "0.2.186"
clap = { version = "4.6.1", features = ["derive"] }
gtk4 = { version = "0.11.3", features = ["v4_16"] }
libadwaita = { version = "0.9.1", features = ["v1_6"] }
async-channel = "2.5.0"
# DSD: .dsf/.dff frame reader (interleaved, MSB-first), used by player-library
# for tag/art extraction and by player-core's tests as a bit-exact oracle. The
# player-core audio path reads .dsf/.dff directly (dsf-meta/dff-meta below) so it
# can seek by byte offset; the SACD .iso path is the in-tree `sacd` crate.
dsd-reader = "0.3"
# Container header parsers (the same ones dsd-reader uses): give us the audio
# data offset / block layout needed for O(1) seeking in player-core::dsd.
dsf-meta = "0.2"
dff-meta = "0.1"
sacd = { path = "crates/sacd" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"

# Faster iteration with a smooth UI in debug builds: optimize all third-party
# deps (gtk4, libadwaita, symphonia, rusqlite, sacd, ...) even under `cargo run`,
# while keeping our own crates lightly optimized for quick rebuilds. Bit-perfect
# verification must still use --release (see CLAUDE.md): debug `overflow-checks`
# panic on overflow but never change the wrapped integer result, so non-overflowing
# packing math is byte-identical to release.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# PGO/BOLT pipeline profile (driven by scripts/pgo-bolt-build.sh and the aarch64
# APKBUILD). Inherits the bit-perfect release settings with two overrides:
#
#   strip = false  — LLVM BOLT needs symbols + relocations in its input binary,
#                    and a stripped binary cannot be BOLTed. The script (and
#                    abuild) strip the final artifact afterwards, so shipped size
#                    is unchanged.
#
#   lto   = "off"  — REQUIRED for `-Cprofile-use` to link. ThinLTO + PGO trips
#                    rust-lang/rust#115344 ("ProfileSummary IDs have conflicting
#                    values"): ThinLTO imports a dependency's bitcode (e.g.
#                    aho_corasick) whose profile coverage differs from the leaf
#                    crate's, and LLVM 22 rejects the conflicting ProfileSummary
#                    module flag. Disabling cross-crate LTO removes the bitcode
#                    import entirely. PGO still applies fully per crate (branch
#                    weights, block ordering, intra-crate inlining via
#                    codegen-units=1) — our hot code (DST, FLAC, scan, search) is
#                    intra-crate, so the cross-crate inlining loss is negligible.
#                    (For absolute-max optimization on a host with plenty of RAM,
#                    `lto = "fat"` also avoids #115344 by unifying into one module
#                    before profile-use — but it's slow/memory-heavy under qemu.)
#
# opt-level/codegen-units are inherited from [profile.release]; PGO/BOLT only
# change code LAYOUT (block/function ordering, inlining heuristics) — never
# numeric results — so the bit-perfect invariant holds (re-verified by the gate).
[profile.release-pgo]
inherits = "release"
strip = false
lto = "off"
