# snd-usb-audio tuning. NOTE: in this image the driver is BUILT-IN
# (CONFIG_SND_USB_AUDIO=y), so modprobe.d is not consulted — its params come from
# the kernel cmdline (snd_usb_audio.lowlatency=1 in 90-audio.conf). This file is
# kept only as a fallback in case the driver is ever built modular again.
#
# 'nrpacks' was removed: it is NOT a snd-usb-audio option in modern kernels (only
# the legacy snd-usb-usx2y driver has it). The latency win now comes from:
#   lowlatency=1  in-driver low-latency URB submission (default: yes)
#   power_save=0  never autosuspend the audio endpoint. Endpoint power-down +
#                 wake-up is a known source of loud pops / state corruption on
#                 USB DACs; belt-and-suspenders with usbcore.autosuspend=-1.
#                 (implicit_fb / autoclock are deliberately NOT forced here — the
#                 Mojo 2 is an async DAC with its own feedback endpoint; see the
#                 README "Safety" notes before toggling those.)
options snd-usb-audio lowlatency=1 power_save=0
