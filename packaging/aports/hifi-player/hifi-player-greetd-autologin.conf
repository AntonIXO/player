# The postmarketOS Phosh package normally points greetd at phrog's greeter
# config. Replace only the command line: the generated config keeps phrog as a
# recovery fallback and adds a non-root initial_session for the image user.
#
# HIFI_PLAYER_AUTOLOGIN=0 in /etc/default/hifi-player restores the normal
# greeter config without removing or disabling greetd itself.
[Service]
RuntimeDirectory=hifi-player-greetd
RuntimeDirectoryMode=0755
ExecStartPre=/usr/libexec/hifi-player-greetd-config /run/hifi-player-greetd/config.toml
ExecStart=
ExecStart=greetd -c /run/hifi-player-greetd/config.toml
