# hifi-player appliance boot policy.
#
# The defaults are intentional for the single-user Phosh image: greetd still
# owns the session and PAM setup, but its greeter is skipped on boot in favor of
# a non-root initial session. Set either value to 0 and reboot to opt out.
HIFI_PLAYER_AUTOLOGIN=1
HIFI_PLAYER_AUTOSTART=1

# Runtime defaults shared by the desktop autostart wrapper.
PLAYER_AUDIO_CPU=7
GSK_RENDERER=vulkan

# The PMI8998 fuel-gauge driver enforces these standard power-supply
# thresholds in-kernel. Set HIFI_PLAYER_CHARGE_LIMIT=0 to restore 100%.
HIFI_PLAYER_CHARGE_LIMIT=90
HIFI_PLAYER_CHARGE_START=85
