# sshd drop-in for the music-sync SFTP share — HARDENING TEMPLATE (inert by default).
#
# This file is intentionally all-comments so installing the package can NEVER lock
# you out of a remote device: SFTP works out of the box with the stock sshd config
# (the sftp subsystem is enabled by default). Once you have confirmed key-based
# login from your laptop, harden by uncommenting below and reloading sshd.
#
# For this drop-in to be read at all, the main /etc/ssh/sshd_config must contain:
#     Include /etc/ssh/sshd_config.d/*.conf
# (Alpine's default config historically does not — add it if missing.)
#
# Do NOT redefine `Subsystem sftp` here: the main config already defines it and a
# duplicate makes sshd refuse to start.
#
# --- recommended hardening (uncomment AFTER your laptop key works) -------------
# Restrict logins to the share user (replace with your username):
#AllowUsers user
# Key-only auth — disables password login (make sure your key is in
# ~/.ssh/authorized_keys first, or you will be locked out):
#PasswordAuthentication no
#KbdInteractiveAuthentication no
#PermitRootLogin no
