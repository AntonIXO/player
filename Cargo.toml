[workspace]
resolver = "2"
members = ["crates/player-core", "crates/player-cli", "crates/player-gtk", "crates/player-library"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
symphonia = { version = "0.5", default-features = false, features = [
    "flac",
    "wav",
    "pcm",
    "alac",
    "isomp4",
] }
alsa = "0.9"
rtrb = "0.3"
crossbeam-channel = "0.5"
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
gtk4 = { version = "0.9", features = ["v4_16"] }
libadwaita = { version = "0.7", features = ["v1_6"] }
async-channel = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
